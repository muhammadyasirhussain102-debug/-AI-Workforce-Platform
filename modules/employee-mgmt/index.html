<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Management — AI Workforce Platform</title>
    <link rel="stylesheet" href="./src/styles/tokens.css" />
    <style>
      .app-shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 240px 1fr;
        background-color: var(--bg-canvas);
        color: var(--text-primary);
      }

      .sidebar {
        background-color: var(--bg-surface);
        border-right: 1px solid var(--border-subtle);
        padding: 20px 14px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .brand {
        padding: 6px 10px 14px;
        border-bottom: 1px solid var(--border-subtle);
      }

      .brand-title {
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: 0.02em;
      }

      .brand-subtitle {
        font-size: 0.75rem;
        color: var(--text-secondary);
        margin-top: 4px;
      }

      .nav-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .nav-btn {
        width: 100%;
        text-align: left;
        background: transparent;
        color: var(--text-secondary);
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        padding: 10px 12px;
        font-size: 0.88rem;
        cursor: pointer;
        transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      }

      .nav-btn:hover {
        background-color: var(--bg-elevated);
        color: var(--text-primary);
      }

      .nav-btn.active {
        background-color: var(--bg-elevated);
        color: var(--text-primary);
        border-color: var(--accent-primary);
      }

      .main-content {
        padding: 28px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border-subtle);
      }

      .page-heading {
        font-size: 1.35rem;
        font-weight: 600;
      }

      .status-pill {
        font-size: 0.78rem;
        padding: 5px 10px;
        border-radius: var(--radius-sm);
        background-color: var(--bg-elevated);
        border: 1px solid var(--border-subtle);
        color: var(--text-secondary);
      }

      .card {
        background-color: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        padding: 20px;
        max-width: 720px;
      }

      .card-title {
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .card-desc {
        font-size: 0.88rem;
        color: var(--text-secondary);
        margin-bottom: 16px;
        line-height: 1.5;
      }

      .form-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .input-field {
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-sm);
        padding: 10px 12px;
        font-size: 0.9rem;
        min-width: 220px;
      }

      .input-field:focus {
        outline: none;
        border-color: var(--accent-primary);
      }

      .btn-primary {
        background-color: var(--accent-primary);
        color: #ffffff;
        border: none;
        border-radius: var(--radius-sm);
        padding: 10px 16px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }

      .btn-primary:hover {
        background-color: var(--accent-hover);
      }

      .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .result-box {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: var(--radius-sm);
        background-color: var(--bg-canvas);
        border: 1px solid var(--border-subtle);
        font-size: 0.85rem;
        white-space: pre-wrap;
        word-break: break-word;
      }

      @media (max-width: 768px) {
        .app-shell {
          grid-template-columns: 1fr;
        }
        .sidebar {
          border-right: none;
          border-bottom: 1px solid var(--border-subtle);
        }
      }
    </style>
  </head>
  <body>
    <div id="root" class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-title">Workforce OS</div>
          <div class="brand-subtitle">Employee Management</div>
        </div>
        <nav aria-label="Module Navigation">
          <ul id="nav-list" class="nav-list"></ul>
        </nav>
      </aside>

      <main class="main-content">
        <header class="header-bar">
          <h1 id="page-heading" class="page-heading">Overview</h1>
          <span id="api-status" class="status-pill">Ready</span>
        </header>

        <section id="view-container" class="card"></section>
      </main>
    </div>

    <script type="module">
      import { EMPLOYEE_MGMT_NAV } from "./src/nav.ts";
      import { punchAttendance } from "./src/api/client.ts";

      const navListEl = document.getElementById("nav-list");
      const pageHeadingEl = document.getElementById("page-heading");
      const viewContainerEl = document.getElementById("view-container");
      const apiStatusEl = document.getElementById("api-status");

      let activeSectionId = EMPLOYEE_MGMT_NAV[0]?.id || "overview";

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderAttendanceCard() {
        viewContainerEl.innerHTML = `
          <h2 class="card-title">Biometric Check-In / Check-Out</h2>
          <p class="card-desc">
            Enter an employee identifier to test attendance punching against the backend API.
          </p>
          <form id="punch-form" class="form-row">
            <input
              id="employee-id-input"
              class="input-field"
              type="text"
              placeholder="Employee ID (e.g. EMP-001)"
              required
            />
            <button id="punch-submit-btn" class="btn-primary" type="submit">
              Record Punch
            </button>
          </form>
          <div id="punch-result" class="result-box" hidden></div>
        `;

        const formEl = document.getElementById("punch-form");
        const inputEl = document.getElementById("employee-id-input");
        const submitBtn = document.getElementById("punch-submit-btn");
        const resultEl = document.getElementById("punch-result");

        formEl?.addEventListener("submit", async (event) => {
          event.preventDefault();
          const employeeId = inputEl.value.trim();

          if (!employeeId) {
            resultEl.hidden = false;
            resultEl.textContent = "Please enter a valid Employee ID.";
            return;
          }

          submitBtn.disabled = true;
          apiStatusEl.textContent = "Submitting...";
          resultEl.hidden = false;
          resultEl.textContent = "Sending attendance request...";

          try {
            const data = await punchAttendance({
              employee_id: employeeId,
              verification_source: "Face ID",
              face_detected: true,
            });
            apiStatusEl.textContent = "Connected";
            resultEl.textContent = JSON.stringify(data, null, 2);
          } catch (error) {
            apiStatusEl.textContent = "API Error";
            resultEl.textContent =
              error instanceof Error ? error.message : "Unexpected error occurred.";
          } finally {
            submitBtn.disabled = false;
          }
        });
      }

      function renderActiveView(item) {
        pageHeadingEl.textContent = item.label;

        if (item.id === "attendance") {
          renderAttendanceCard();
          return;
        }

        viewContainerEl.innerHTML = `
          <h2 class="card-title">${escapeHtml(item.label)}</h2>
          <p class="card-desc">
            Route: <code>${escapeHtml(item.path)}</code>. Select a module section from the sidebar or continue building out this view.
          </p>
        `;
      }

      function renderNavigation() {
        navListEl.innerHTML = "";

        for (const item of EMPLOYEE_MGMT_NAV) {
          const li = document.createElement("li");
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = `nav-btn ${item.id === activeSectionId ? "active" : ""}`;
          btn.textContent = item.label;
          btn.addEventListener("click", () => {
            activeSectionId = item.id;
            renderNavigation();
            renderActiveView(item);
          });
          li.appendChild(btn);
          navListEl.appendChild(li);
        }
      }

      const initialItem =
        EMPLOYEE_MGMT_NAV.find((nav) => nav.id === activeSectionId) || EMPLOYEE_MGMT_NAV[0];

      if (initialItem) {
        renderNavigation();
        renderActiveView(initialItem);
      }
    </script>
  </body>
</html>
